name: Validar Pull Request

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-source:
    name: Origem permitida
    runs-on: ubuntu-latest
    steps:
      - name: Permitir apenas develop para main
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "Somente a branch develop pode abrir Pull Request para main."
          exit 1

  frontend-build:
    name: Build do frontend
    needs: validate-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontBillingOrganizer
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontBillingOrganizer/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar build
        run: npm run build

  backend-build:
    name: Validar backend
    needs: validate-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Compilar backend
        run: python -m py_compile main.py
